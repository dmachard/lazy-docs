services:
  app:
    build: .
    container_name: lazydocs_app
    ports:
      - "8085:8000"
    environment:
      - KEV_HOST=http://kev:8009
      - KEV_MODEL=jaredpalmer/kev-0.8b
      - WORKER_CONCURRENCY=1
      - LLM_SNIPPET_MAX_CHARS=2500
      - TAG=${TAG:-dev}
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./categories.yaml:/app/categories.yaml:ro
      - lazydocs_data:/app/data
    depends_on:
      - kev
    restart: unless-stopped

  kev:
    build:
      context: .
      dockerfile: Dockerfile.kev
    container_name: lazydocs_kev
    ports:
      - "8009:8009"
    volumes:
      - kev_cache:/root/.cache
    restart: unless-stopped

volumes:
  lazydocs_data:
    driver: local
  kev_cache:
    driver: local
